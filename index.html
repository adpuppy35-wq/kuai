<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>русско-китайский словарь</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">

        <app-header></app-header>

        <!-- ========== ОСНОВНОЙ КОНТЕНТ ========== -->
        <div class="content-wrapper">
            <main class="main">
                <!-- ГЕРОЙ -->
                <section class="hero">
                    <h1 class="main-title">kuai</h1>
                    <p class="main-subtitle">русско-китайский словарь <br> для бортпроводников</p>

                    <!-- ПОИСК -->
                    <form class="search-form">
                        <input type="text" class="search-input" v-model="searchString" placeholder="Поиск по темам...">
                    </form>
                </section>

                <!-- ПОСЛЕДНИЕ СТАТЬИ -->
                <section class="articles-section">
                    <div class="articles-grid">
                        <article v-for="article in filteredArticles" :key="article.id" class="article-card">
                            <div class="article-image">
                                <img :src="article.image" :alt="article.title">
                            </div>
                            <div class="article-content">
                                <span class="article-tag">{{ article.tag }}</span>
                                <h3 class="article-title">{{ article.title }}</h3>
                                <p class="article-excerpt">{{ article.excerpt }}</p>
                                <a :href="article.url" class="article-link">читать →</a>
                            </div>
                        </article>
                    </div>
                </section>
            </main>
        </div>

        <app-footer></app-footer>

    </div>

    <script src="./js/components/app-header.js"></script>
    <script src="./js/components/app-footer.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
